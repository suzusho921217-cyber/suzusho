# §5 publish: 投稿時間ごとに媒体別ポリシー再判定→投稿。
name: publish
on:
  schedule:
    - cron: "0 3,9,12 * * *"  # 12:00 / 18:00 / 21:00 JST
  workflow_dispatch:

concurrency:
  group: sns-pipeline-state
  cancel-in-progress: false

jobs:
  call:
    uses: ./.github/workflows/_reusable.yml
    with:
      command: publish
    secrets: inherit
