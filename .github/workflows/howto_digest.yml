# 「再生数を伸ばす方法」解説動画20本を無料枠 Gemini で要約（手動・使い捨て）。状態は触らない。
name: howto_digest
on:
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: digest
        env:
          GEMINI_ANALYSIS_API_KEY: ${{ secrets.GEMINI_ANALYSIS_API_KEY }}
        run: python scripts/howto_digest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: howto-digest-${{ github.run_id }}
          path: howto/*.json
