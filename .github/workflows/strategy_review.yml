# strategy-review: 経営企画役を週1で呼び、各媒体の収益化ラインまでの距離・到達見込み・
# リソース配分・動画以外の収益経路・継続/撤退シグナルをまとめる。
# docs/monetization_roadmap.md の週次所見欄を更新してコミットし、メールで報告する。
# config・コード・予算は変更しない（読み取り＋所見のみ）。
name: strategy_review
on:
  schedule:
    - cron: "20 21 * * 0"  # 毎週月曜 06:20 JST（日曜 21:20 UTC）
  workflow_dispatch:

permissions:
  contents: write

# 各媒体の現在地を管理DB/.state から読むので、パイプラインと同じ直列グループに入れる。
concurrency:
  group: sns-pipeline-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # ワークフロー間の .state/ 引き継ぎ（§15）。GitHub Actions のキャッシュ（無料）を使う。
      # 以前は GCS から毎回 mp4 込みで全部落としていて転送料が高額になった（2026-10-02 移行）。
      # 復元できない＝引き継ぐ状態が無い（予算の消化額も分からない）ので、空のまま走らせず止める。
      - name: 状態の復元（Actions キャッシュ）
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: sns-state-${{ github.run_id }}-${{ github.run_attempt }}-strategy-review
          restore-keys: sns-state-
          fail-on-cache-miss: true

      - name: 状態の指紋（実行前）
        id: before
        run: echo "sum=$(find .state -type f -print0 | sort -z | xargs -0 md5sum | md5sum | cut -c1-32)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: strategy-review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MTG_MODEL: claude-sonnet-5   # 週1なので費用より判断の質を優先（日次MTGはHaikuのまま）
          SHEETS_SPREADSHEET_ID: ${{ secrets.SHEETS_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEETS_BACKEND: ${{ vars.SHEETS_BACKEND }}
          GMAIL_SENDER_ADDRESS: ${{ secrets.GMAIL_SENDER_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          # 企画日が3日より前の動画は消してからキャッシュに保存する（キャッシュを小さく保つ）
          STATE_PRUNE_DAYS: "3"
        run: python -m src.cli strategy-review

      - name: 状態の指紋（実行後）
        id: after
        if: always() && steps.restore.outcome == 'success'
        run: echo "sum=$(find .state -type f -print0 | sort -z | xargs -0 md5sum | md5sum | cut -c1-32)" >> "$GITHUB_OUTPUT"

      # 変化があったときだけ新しいキャッシュとして保存（次のランは最新のものを復元する）。
      # 復元に失敗したランは保存しない（空や途中の状態で上書きしないため）。
      - name: 状態の保存（Actions キャッシュ）
        if: always() && steps.restore.outcome == 'success' && steps.after.outputs.sum != steps.before.outputs.sum
        uses: actions/cache/save@v4
        with:
          path: .state
          key: sns-state-${{ github.run_id }}-${{ github.run_attempt }}-strategy-review

      - name: 状態退避
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-strategy-review-${{ github.run_id }}
          path: .state/
          if-no-files-found: ignore

      - name: 週次所見の更新をコミット
        run: |
          git config user.name "strategy-review[bot]"
          git config user.email "strategy-review@users.noreply.github.com"
          # checkout が古い SHA（再実行など）でも、常に最新 main の上に所見を載せ直して push。
          # main が動いていて衝突したら数回リトライ。最後まで push できなくても workflow は
          # 失敗させない（翌週の実行で反映される）。
          for i in 1 2 3; do
            git fetch -q origin main
            git checkout -q -B main origin/main
            git checkout -q origin/main -- docs/monetization_roadmap.md
            python -c "import json,glob; from src.strategy.review import _update_roadmap; \
              d=json.load(open(sorted(glob.glob('.state/strategy-*.json'))[-1])); p=d.get('parsed') or {}; \
              p.get('weekly_note') and _update_roadmap(p['weekly_note'], d['date'])"
            if [ -z "$(git status --porcelain docs/monetization_roadmap.md)" ]; then
              echo "変更なし、コミットしない"; exit 0
            fi
            git add docs/monetization_roadmap.md
            git commit -q -m "strategy-review: 週次所見を更新"
            if git push -q origin main; then echo "pushed"; exit 0; fi
            git reset -q --hard HEAD~1
            sleep 5
          done
          echo "::warning::週次所見を push できなかった（翌週の実行で反映される）"
