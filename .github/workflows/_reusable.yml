# 共通セットアップ（再利用ワークフロー）。各ジョブから呼ぶ。
name: _reusable-setup

on:
  workflow_call:
    inputs:
      command:
        required: true
        type: string
      extra_args:
        required: false
        type: string
        default: ""
      commit_paths:
        # 実行後に main へコミットするファイル（空なら何もしない）。呼び出し側に
        # permissions: contents: write が必要。
        required: false
        type: string
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    # 1回の実行の上限。外部APIが応答しないまま止まると、同じ順番待ちの後続（投稿など）が詰まるため
    timeout-minutes: 30
    environment: production        # Secrets は Environment 側で管理（§5）
    steps:
      - uses: actions/checkout@v4

      # ワークフロー間の .state/ 引き継ぎ（§15）。GitHub Actions のキャッシュ（無料）を使う。
      # 以前は GCS から毎回 mp4 込みで全部落としていて転送料が高額になった（2026-10-02 移行）。
      # 復元できない＝引き継ぐ状態が無い（予算の消化額も分からない）ので、空のまま走らせず止める。
      - name: 状態の復元（Actions キャッシュ）
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: sns-state-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.command }}
          restore-keys: sns-state-
          fail-on-cache-miss: true

      - name: 状態の指紋（実行前）
        id: before
        run: echo "sum=$(find .state -type f -print0 | sort -z | xargs -0 md5sum | md5sum | cut -c1-32)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: ffmpeg
        # apt-get update && install だと、ランナーに既定で入っている無関係な
        # リポジトリ（Google Chrome 等）が一時的に壊れているだけで install まで
        # 巻き込まれて失敗する(2026-09-09 実際に発生・自然復旧待ちで数十分ロスした)。
        # ffmpeg は Ubuntu 標準リポジトリにあるので、update 失敗は無視して進める。
        # fonts-noto-cjk はテロップ焼き込み用の日本語フォント（media）
        run: sudo apt-get update || true; sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: run
        env:
          # 必要な Secrets を Environment から注入（実キーはコード/Sheetsに保存しない）
          SHEETS_SPREADSHEET_ID: ${{ secrets.SHEETS_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # 企画日が3日より前の動画は消してからキャッシュに保存する（キャッシュを小さく保つ）
          STATE_PRUNE_DAYS: "3"
          VIDEO_PROVIDER: ${{ vars.VIDEO_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # VIDEO_PROVIDER=veo（§12）
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # 投稿タイトル/本文のAI生成（copywriter）
          GEMINI_ANALYSIS_API_KEY: ${{ secrets.GEMINI_ANALYSIS_API_KEY }}  # 型カード（無料枠専用キー）
          PUBLISH_MODE: ${{ vars.PUBLISH_MODE }}          # 未設定なら dryrun
          SHEETS_BACKEND: ${{ vars.SHEETS_BACKEND }}      # 未設定なら local
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          # チャンネル(ブランド)ごとに別トークン。共通の同一Google Cloudプロジェクト・
          # OAuthクライアントは使い回すが、リフレッシュトークンはチャンネル単位で別発行。
          YOUTUBE_OAUTH_REFRESH_TOKEN_CAT: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_CAT }}
          YOUTUBE_OAUTH_REFRESH_TOKEN_DOG: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_DOG }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          # チャンネル(ブランド)ごとに別アカウント・別トークン
          IG_ACCESS_TOKEN_CAT: ${{ secrets.IG_ACCESS_TOKEN_CAT }}
          IG_ACCESS_TOKEN_DOG: ${{ secrets.IG_ACCESS_TOKEN_DOG }}
          IG_BUSINESS_ACCOUNT_ID_CAT: ${{ secrets.IG_BUSINESS_ACCOUNT_ID_CAT }}
          IG_BUSINESS_ACCOUNT_ID_DOG: ${{ secrets.IG_BUSINESS_ACCOUNT_ID_DOG }}
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}   # Instagram投稿用の動画一時公開
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          GMAIL_SENDER_ADDRESS: ${{ secrets.GMAIL_SENDER_ADDRESS }}   # ガードレール通知（§13 §14）
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python -m src.cli ${{ inputs.command }} ${{ inputs.extra_args }}

      - name: 生成物をコミット
        if: inputs.commit_paths != ''
        run: |
          if [ -z "$(git status --porcelain -- ${{ inputs.commit_paths }})" ]; then
            echo "変更なし、コミットしない"; exit 0
          fi
          git config user.name "sns-bot[bot]"
          git config user.email "sns-bot@users.noreply.github.com"
          git add -- ${{ inputs.commit_paths }}
          git commit -q -m "${{ inputs.command }}: ${{ inputs.commit_paths }} を自動更新"
          # main が先に進んでいたら rebase して再試行。push できなくても失敗にしない（翌日反映）
          for i in 1 2 3; do
            if git push -q origin HEAD:main; then echo "pushed"; exit 0; fi
            git fetch -q origin main && git rebase -q origin/main
            sleep 5
          done
          echo "::warning::${{ inputs.commit_paths }} を push できなかった（翌日の実行で反映される）"

      - name: 状態の指紋（実行後）
        id: after
        if: always() && steps.restore.outcome == 'success'
        run: echo "sum=$(find .state -type f -print0 | sort -z | xargs -0 md5sum | md5sum | cut -c1-32)" >> "$GITHUB_OUTPUT"

      # 変化があったときだけ新しいキャッシュとして保存（次のランは最新のものを復元する）。
      # 復元に失敗したランは保存しない（空や途中の状態で上書きしないため）。
      - name: 状態の保存（Actions キャッシュ）
        if: always() && steps.restore.outcome == 'success' && steps.after.outputs.sum != steps.before.outputs.sum
        uses: actions/cache/save@v4
        with:
          path: .state
          key: sns-state-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.command }}

      - name: 状態退避（§15）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-${{ inputs.command }}-${{ github.run_id }}
          path: .state/
          if-no-files-found: ignore
