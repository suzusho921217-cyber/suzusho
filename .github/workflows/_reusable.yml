# 共通セットアップ（再利用ワークフロー）。各ジョブから呼ぶ。
name: _reusable-setup

on:
  workflow_call:
    inputs:
      command:
        required: true
        type: string
      extra_args:
        required: false
        type: string
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    environment: production        # Secrets は Environment 側で管理（§5）
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: run
        env:
          # 必要な Secrets を Environment から注入（実キーはコード/Sheetsに保存しない）
          SHEETS_SPREADSHEET_ID: ${{ secrets.SHEETS_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # ワークフロー間の .state/ 引き継ぎ（§15）。GCS を共有ストアにする
          # （バケットは下の GCS_BUCKET_NAME を流用）。各ワークフローは独立スケジュールの
          # ままで、pull → 実行 → 変更分だけ push。
          STATE_SYNC: "1"
          VIDEO_PROVIDER: ${{ vars.VIDEO_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # VIDEO_PROVIDER=veo（§12）
          PUBLISH_MODE: ${{ vars.PUBLISH_MODE }}          # 未設定なら dryrun
          SHEETS_BACKEND: ${{ vars.SHEETS_BACKEND }}      # 未設定なら local
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          # チャンネル(ブランド)ごとに別トークン。共通の同一Google Cloudプロジェクト・
          # OAuthクライアントは使い回すが、リフレッシュトークンはチャンネル単位で別発行。
          YOUTUBE_OAUTH_REFRESH_TOKEN_CAT: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_CAT }}
          YOUTUBE_OAUTH_REFRESH_TOKEN_DOG: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_DOG }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          # チャンネル(ブランド)ごとに別アカウント・別トークン
          IG_ACCESS_TOKEN_CAT: ${{ secrets.IG_ACCESS_TOKEN_CAT }}
          IG_ACCESS_TOKEN_DOG: ${{ secrets.IG_ACCESS_TOKEN_DOG }}
          IG_BUSINESS_ACCOUNT_ID_CAT: ${{ secrets.IG_BUSINESS_ACCOUNT_ID_CAT }}
          IG_BUSINESS_ACCOUNT_ID_DOG: ${{ secrets.IG_BUSINESS_ACCOUNT_ID_DOG }}
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}   # Instagram投稿用の動画一時公開
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          GMAIL_SENDER_ADDRESS: ${{ secrets.GMAIL_SENDER_ADDRESS }}   # ガードレール通知（§13 §14）
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python -m src.cli ${{ inputs.command }} ${{ inputs.extra_args }}

      - name: 状態退避（§15）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-${{ inputs.command }}-${{ github.run_id }}
          path: .state/
          if-no-files-found: ignore
