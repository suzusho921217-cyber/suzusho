# 企画の試し作成（手動・状態は保存しない・生成も投稿もしない）。翌日分の企画と台本を作って表示する。
name: plan_preview
on:
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: .state
          key: sns-state-preview-${{ github.run_id }}
          restore-keys: sns-state-
          fail-on-cache-miss: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: plan preview
        env:
          GEMINI_ANALYSIS_API_KEY: ${{ secrets.GEMINI_ANALYSIS_API_KEY }}
        run: |
          python -m src.cli plan-daily --date "$(TZ=Asia/Tokyo date -d tomorrow +%F)" --out preview/plan.json
          python -c "import json; [print('\n=====', p['plan_id'], p['concept_tag'], '/', p['hook_type'], '\n', p['prompt_text']) for p in json.load(open('preview/plan.json'))['plans']]"
