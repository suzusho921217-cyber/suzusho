# agent-mtg: analyst→researcher→marketer→critic→coordinatorの5役職を毎日呼び、
# coordinatorの結論のうち費用・ポリシーが絡まない提案だけconfigに自動反映してコミットする。
# 費用が絡む提案・ポリシーが絡む提案は自動実行しない（メール報告のみ、ユーザー判断）。
name: agent_mtg
on:
  schedule:
    - cron: "37 20 * * *"  # 05:37 JST（daily_learning 05:00 JST の後）
  workflow_dispatch:

permissions:
  contents: write

# パイプラインの .state/ を読む（勝ちタグ・plan・成績）ので同じ直列グループに入れる。
concurrency:
  group: sns-pipeline-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          # context.pyが直近14日のgit logを会議の材料にするため、浅いcloneではなく
          # 履歴ごと取得する（既定のfetch-depth:1だと最新1コミットしか見えない）。
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: agent-mtg
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHEETS_SPREADSHEET_ID: ${{ secrets.SHEETS_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEETS_BACKEND: ${{ vars.SHEETS_BACKEND }}
          GMAIL_SENDER_ADDRESS: ${{ secrets.GMAIL_SENDER_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          # 共有 .state/ を読み書き（勝ちタグ・plan・成績を材料にする / mtg-<date>.json を残す）
          STATE_SYNC: "1"
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
        run: python -m src.cli agent-mtg

      - name: 状態退避
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-agent-mtg-${{ github.run_id }}
          path: .state/
          if-no-files-found: ignore

      - name: 自動反映したconfigをコミット
        run: |
          if [ -z "$(git status --porcelain config/)" ]; then
            echo "変更なし、コミットしない"
            exit 0
          fi
          git config user.name "agent-mtg[bot]"
          git config user.email "agent-mtg@users.noreply.github.com"
          git add config/planning.yaml config/hashtags.yaml
          git commit -q -m "agent-mtg: 自動反映（費用・ポリシー無関係の企画/ハッシュタグのみ）"
          # push 時点で main が先に進んでいたら rebase して再試行。それでも
          # push できなくても workflow は失敗させない（翌日の実行で反映される）。
          for i in 1 2 3; do
            if git push -q origin HEAD:main; then echo "pushed"; exit 0; fi
            git fetch -q origin main
            git rebase -q origin/main
            sleep 5
          done
          echo "::warning::agent-mtg の config 反映を push できなかった（翌日の実行で反映される）"
