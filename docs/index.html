            ${i.review ? `<span class="review">${i.review}</span>` : ''}
            <span class="provider">${i.provider}</span>
          </div>
          <div class="actions">
            <a class="btn buy" href="${i.link}" target="_blank" rel="noopener sponsored">今すぐ見てみる →</a>
            <a class="btn watch" href="https://www.youtube.com/shorts/${i.video}" target="_blank" rel="noopener">▶ 動画</a>
          </div>
        </div>
      </li>
    `).join('');
  }

  tabCat.addEventListener('click', () => render('cat'));
  tabDog.addEventListener('click', () => render('dog'));

  render('cat');
</script>
</body>
</html>
