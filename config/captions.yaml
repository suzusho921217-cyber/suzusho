# キャプション末尾に付ける「視聴者参加の一言」（§2）。
# 傾向: コメント/いいねが多い動画ほど伸びる → 毎回コメントしたくなる問いを1つ入れる。
# concept に相性のいいものがあればそれを、無ければ general から日付シードで1つ。
# ★反応を見て learning とは別に手で入れ替える。

general:
  - "うちの子もこれやる人〜🙋"
  - "10点満点で可愛さ何点？🐾"
  - "この子の名前、何がいいと思う？"
  - "続き見たい人はコメントで教えて"
  - "どのシーンが一番好き？"
  - "保存していつでも見返してね"
  - "タグして見せたい人いる？"

by_concept:
  二段オチ: ["オチ、予想できた？", "着地、何点？(10点満点)"]
  そっくりさん: ["どっちが本物か分かる？", "①と②、見分けつく人？"]
  予想させる: ["この後どうなったと思う？コメントで！", "①成功 ②大失敗 ③まさかの…どれ？"]
  どっちが: ["①と②、どっちが好き？コメントで！"]
  あるある: ["うちの子もやる！って人🙋", "共感したらいいね🐾"]
  気づいたら: ["バレた瞬間の顔ｗ 何て言ってそう？"]
  人間くさい: ["もう人間。セリフ付けるなら何て言う？"]
  予想外のサイズ感: ["この後ちゃんと出てこれたと思う…？"]
