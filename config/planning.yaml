# 企画候補プール（§6）。
# planner.build_daily_plan が「explore（新規探索）」枠の企画を組むときのネタ元。
# 「exploit（勝ちパターン活用）」枠は learning の winning_tags から作るので、ここは使わない。
#
# 方針:
#   - ただ可愛いだけだと「で？」で終わる。8〜15秒の中に「フリ→展開→オチ」を必ず入れる。
#   - concept_tag = どんな小さな物語か。hook_type = 冒頭の掴み方。
#   - AI生成はトレンド音源ダンス系は不利（音ハメ不可）→ 音なしで成立する視覚オチで勝負。
#   - 「固定キャラの連載」で覚えてもらう。

defaults:
  prompt_version: "v3"
  duration_target_sec: [8, 15]      # Veo は 8s 基本＋extend で 15s まで

brands:
  cat:
    # 品種プール（config/characters.yaml のキー）。explore 枠は日替わりで巡回、
    # exploit 枠は winning_tags の勝ち品種を採用。character_id（単数）でも後方互換。
    characters: [cat_persian, cat_munchkin, cat_british_shorthair, cat_scottish_fold,
                 cat_ragdoll, cat_calico, cat_tabby]
    policy_risk: LOW
    concept_tags:
      - "二段オチ"          # 失敗する→と思いきや別の形で成功／もっと変な結果に
      - "そっくりさん"      # 自分に似た物（パン・ぬいぐるみ）の隣で同じポーズ、見分けつかない
      - "予想外のサイズ感"  # 極小の子猫 vs 巨大な物。並ぶと笑える
      - "気づいたら"        # カメラに気づいてピタッと固まり、そっと自然なフリをする
      - "予想させる"        # フリ→展開まで見せてオチ直前でカット。「どうなった?」を誘う（視聴者参加）
      - "あるある"          # 猫あるある。共感でコメント/いいねを誘う（視聴者参加）
      - "昼寝あけドラマ"    # 寝ぼけて壮大に転ぶ→何事もなかった顔で二度寝
      - "人間くさい"        # 家賃払ってる顔でため息、電卓を叩く、会議に乱入
    hook_types:
      - "いきなりドアップ"      # 0.5秒で顔面ドアップ→引くと状況が見える
      - "カメラ目線でにゃっ"    # 冒頭で目が合う→本編へ
      - "スロー入り"            # 冒頭だけスロー→通常速度でオチ
      - "画面外から侵入"        # 端からぬっと入ってくる
    reality_level: [4, 5]           # 実写級
    oddity_level: [1, 2]            # 基本は自然。「そっくりさん」等だけ 2

  dog:
    characters: [dog_golden_retriever, dog_corgi, dog_pomeranian, dog_french_bulldog,
                 dog_toy_poodle, dog_shiba, dog_beagle]
    policy_risk: LOW
    concept_tags:
      - "二段オチ"
      - "そっくりさん"
      - "予想外のサイズ感"
      - "気づいたら"
      - "タイミングの奇跡"
      - "全力空回り"          # 走り出す→足が空転→変な方向に飛んでいく
      - "人間くさい"
    hook_types:
      - "いきなりドアップ"
      - "カメラ目線でワンっ"
      - "スロー入り"
      - "画面外から侵入"
    reality_level: [4, 5]
    oddity_level: [1, 2]

  # adult は Veo が非露骨でも生成拒否（入力＋出力の二重フィルタ）。当面スコープ外。
  # 有効化するなら別の動画モデルが必要で、法務・収益化リスクが高い。config/brands.yaml で無効のまま。
  adult:
    character_id: ADULT_001
    policy_risk: HIGH
    concept_tags: ["fashion", "日常", "POV"]
    hook_types: ["視線誘導", "突然の動き"]
    reality_level: [4, 5]
    oddity_level: [1, 2]
