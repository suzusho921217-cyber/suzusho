# スコアリングと自動配分（§11）

allocation:
  total_daily_slots: 2              # 1日2本（日次予算¥200のまま3本目が95%ガードで
                                    # 毎日のように落ちていたため。2026-09-10 3→2）
                                    # Veo 720p 8秒 ¥64/本 × 2 = ¥128/日。媒体数は複数に展開する。
  exploit_ratio: 0.70              # 既存勝ちパターン
  explore_ratio: 0.30              # 新企画・新フック・新尺
  brand_max_ratio: 0.60           # 1ブランド配分上限
  brand_min_explore_posts: 1      # 各ブランド最低探索を一定周期で確保
  eval_windows_days: [7, 30]      # 直近7日＋30日を併用
  outlier_guard: true             # 1本の超バズで全配分を変えない

# 収益化前スコア（媒体で取得できない指標は重みを再正規化）
score_weights_pre_monetization:
  completion_rate: 0.30
  share_rate: 0.25
  follow_rate: 0.25
  comment_rate: 0.10
  cost_efficiency: 0.10           # cost_per_1k_views の逆数を正規化

# 収益化後は実収益・利益率の比重を上げる
score_weights_post_monetization:
  roi: 0.35
  revenue_jpy: 0.20
  completion_rate: 0.15
  follow_rate: 0.15
  share_rate: 0.10
  comment_rate: 0.05

# 学習エンジン（§11）— 勝ちタグ抽出のパラメータ
learning:
  monetized: false                 # true で score_weights_post_monetization に切替
  score_snapshot_order: ["7d", "72h", "24h", "latest"]  # スコアに使う snapshot の優先順
  eval_window_weights:             # 直近7日と30日のスコアの合成比（§11）
    "7": 0.6
    "30": 0.4
  min_posts_for_winner: 3          # 直近30日でこの本数未満の組は勝ちタグにしない（異常値ガード §11）

  # 企画として狙って作ったものではない投稿（手動テスト等）を勝ちタグ抽出から除外する
  # post_key の一覧。2026-09-05: Veo APIテストで先に生成済みのサンプル動画を
  # 「Cat Moments開設記念」として正式投稿した2本（新規plan側は exclude_from_learning
  # で対応済みだが、この2本は投稿DB側に遡って反映していないためここでも明示除外）。
  excluded_post_keys:
    - "2026-09-05-cat-sample01:youtube"
    - "2026-09-05-cat-sample01-ig:instagram"

  # 媒体別の重み上書き（completion_rate に頼れない媒体向け）。
  # YouTube Shorts は Analytics API が averageViewDuration / engagedViews を
  # 常に 0・欠損で返す（2026-09-11 実データで全件確認）ため completion_rate が
  # 常時欠損になる。指定しなければ compute_score が毎回自動で残り指標に
  # 重みを再分配するが、それを「YouTubeはこの指標を使わない」という明示設定にする。
  score_weight_overrides:
    youtube:
      share_rate: 0.36
      follow_rate: 0.36
      comment_rate: 0.14
      cost_efficiency: 0.14
