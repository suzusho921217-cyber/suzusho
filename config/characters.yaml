# Character Registry（§6 末尾）
#
# 方針転換（2026-09-06）: 「もち」「だいふく」の固定1キャラ連載をやめ、いろんな
# 犬種・猫種のプールにする。planner が explore 枠で品種を日替わりローテーション、
# exploit 枠は winning_tags が示す勝ち品種を採用する（learning が品種別の成績を
# 自動で見つける）。
#
# 共通の性格・声・世界観は _cat_common / _dog_common（YAML アンカー）で共有し、
# 品種ごとに違うのは appearance（外見）だけ。appearance はプロンプトの核。
# 幼さ・赤ちゃん体型・不器用な可愛さは全品種で共通の方向性。

characters:
  _cat_common: &cat_common
    brand: cat
    personality: >-
      好奇心旺盛でちょっとドジ。まだ体の使い方に慣れておらず、踏ん張りきれずコロンと
      転がる、よろけて壁にぶつかるなど赤ちゃん特有の不器用さがある。表情がころころ
      変わり、遊んでいる途中でも急に糸が切れたようにすとんと眠くなる。
    voice: "高くて小さな、まだ頼りない鳴き声。喋らない。"
    world: >-
      明るいナチュラルな室内。木漏れ日、観葉植物、ニットのブランケット、木の家具。
      生活感はあるが散らかっていない。
    forbidden: &animal_forbidden
      - "実在ブランドのロゴ"
      - "人間の顔をはっきり映す"
      - "痛がる・怯える・危険に見える描写"
    reference_image_ref: ""

  _dog_common: &dog_common
    brand: dog
    personality: >-
      元気いっぱいで人懐っこい。まだ自分の足の大きさに体がついていっておらず、全力で
      走って足がもつれて盛大にコケる、しっぽを追いかけて目を回す等、幼い犬らしい
      可愛い不器用さがある。
    voice: "高くてまだ舌足らずな子犬の鳴き声。喋らない。"
    world: "明るい庭・公園・ナチュラルな室内。芝生、木のボウル、木漏れ日。"
    forbidden: *animal_forbidden
    reference_image_ref: ""

  # --- 猫 ---
  cat_persian:
    <<: *cat_common
    display_name: "ペルシャの子猫"
    appearance: >-
      ふわふわの長毛。クリーム〜シルバーの被毛、低くつぶれた鼻、離れ気味の大きな丸い目。
      頭が体に対して大きい赤ちゃん体型でずんぐりまんまる、足取りはヨチヨチ。首に細い水色のリボン。
  cat_munchkin:
    <<: *cat_common
    display_name: "マンチカンの子猫"
    appearance: >-
      短い足の子猫。短毛のキジ白、大きな瞳、丸い頭。足が短いのでちょこちょこ歩き、
      背伸びや立ち上がりが不器用で可愛い。赤ちゃん体型でお腹ぽっこり。首に細いリボン。
  cat_british_shorthair:
    <<: *cat_common
    display_name: "ブリティッシュショートヘアの子猫"
    appearance: >-
      もふっとした短毛でブルーグレー。丸顔・丸い目（銅色）・むちむちほっぺ。
      ずんぐりした赤ちゃん体型、真顔でぼんやりした表情。首に細いリボン。
  cat_scottish_fold:
    <<: *cat_common
    display_name: "スコティッシュフォールドの子猫"
    appearance: >-
      折れ耳の子猫。クリーム〜グレーの短毛、まん丸の頭と目、垂れた小さい耳。
      座り方が独特でだらんとしがち。赤ちゃん体型でまんまる。首に細いリボン。
  cat_ragdoll:
    <<: *cat_common
    display_name: "ラグドールの子猫"
    appearance: >-
      長毛で色はポイントカラー（顔・耳・足先が濃い）、目は青。ふわふわで大きめだが
      まだ子猫、抱かれるとぬいぐるみのように脱力する。首に細いリボン。
  cat_calico:
    <<: *cat_common
    display_name: "三毛猫の子猫"
    appearance: >-
      白・茶・黒の三毛の和猫。短毛、大きな目、細い手足の赤ちゃん体型。表情豊かで
      少しやんちゃ。首に細い和柄の首輪。
  cat_tabby:
    <<: *cat_common
    display_name: "キジトラの子猫"
    appearance: >-
      キジトラ模様の短毛の和猫。緑がかった目、ピンクの鼻、細い手足のヨチヨチ赤ちゃん体型。
      好奇心が顔に出やすい。首に細い首輪。

  # --- 犬 ---
  dog_golden_retriever:
    <<: *dog_common
    display_name: "ゴールデンレトリバーの子犬"
    appearance: >-
      ふわふわの金色の被毛、大きな肉球、たれ耳、いつも笑っているような口元。
      体に対して大きすぎる足、ぽっこりお腹の赤ちゃん体型。首に生成りのバンダナ。
  dog_corgi:
    <<: *dog_common
    display_name: "コーギーの子犬"
    appearance: >-
      短い足・大きな立ち耳・ふさふさのしっぽ（or 断尾でぷりっとしたお尻）。
      胴長短足でパン（ローフ）のような形。走ると足が空回りしがち。首にバンダナ。
  dog_pomeranian:
    <<: *dog_common
    display_name: "ポメラニアンの子犬"
    appearance: >-
      小さな毛玉。オレンジ〜クリームのふわふわ被毛、丸い顔、つぶらな目、小さな立ち耳。
      とても小さくコロコロで、動くと毛玉が転がるよう。首に細いバンダナ。
  dog_french_bulldog:
    <<: *dog_common
    display_name: "フレンチブルドッグの子犬"
    appearance: >-
      短毛のクリーム or パイド、大きなコウモリ耳、しわのある鼻ぺちゃ顔、表情が豊か。
      むちむちずんぐりの赤ちゃん体型。おっとりドジ。首にバンダナ。
  dog_toy_poodle:
    <<: *dog_common
    display_name: "トイプードルの子犬"
    appearance: >-
      くるくる巻き毛（アプリコット or クリーム）、まん丸カット、真っ黒なつぶらな目と鼻。
      細い脚でぴょこぴょこ跳ねる。ぬいぐるみのよう。首にバンダナ。
  dog_shiba:
    <<: *dog_common
    display_name: "柴犬の子犬"
    appearance: >-
      まん丸コロコロの豆柴。淡い赤毛に白いお腹、太く短い足、くるんと巻いた尻尾、
      口角が上がって笑っているような顔。赤ちゃん特有のプニプニ体型。首に生成りのバンダナ。
  dog_beagle:
    <<: *dog_common
    display_name: "ビーグルの子犬"
    appearance: >-
      白・茶・黒の三色、長いたれ耳、丸い茶色の目、少し悲しげに見えるが元気。
      むちむちの赤ちゃん体型。鼻を使って何かを探しがち。首にバンダナ。

  ADULT_001:
    brand: adult
    display_name: "（未確定）"
    appearance: "成人であることが明確な外見。未成年に見える要素を禁止。"
    personality: "（性格）"
    voice: "（声の方向性）"
    world: "ファッション / 日常 / POV 等、媒体規約内"
    forbidden:
      - "未成年・若年に見える表現"
      - "露骨な性的表現・裸体・性行為"
    reference_image_ref: ""
