# Character Registry（§6 末尾）
# 固定キャラは reference image / 外見記述 / 性格 / 禁止事項 / 声 / 世界観 を保存。
# reference_image はリポジトリに置かず、Drive/Storage の ID かパスを指す。
#
# ★ appearance は「毎回同じ猫」に見せるための核。プロンプトにそのまま差し込まれる。
#   運用で reference_image を用意したら、それに寄せて微修正する。

characters:
  CAT_001:
    brand: cat
    display_name: "もち（仮）"
    appearance: >-
      ふわふわの長毛の子猫。クリーム色〜薄いグレーの被毛で、耳と足先だけ少し濃い。
      まん丸で大きな琥珀色の目、短い鼻、ぷにっとしたピンクの肉球。ずんぐりした体型で
      少し不器用そう。首に細い水色のリボン。
    personality: "好奇心旺盛で、ちょっとドジ。表情がころころ変わる。すぐ眠くなる。"
    voice: "高めの小さな鳴き声。喋らない。"
    world: >-
      明るいナチュラルな室内。木漏れ日、観葉植物、ニットのブランケット、木の家具。
      生活感はあるが散らかっていない。
    forbidden:
      - "実在ブランドのロゴ"
      - "人間の顔をはっきり映す"
      - "痛がる・怯える・危険に見える描写"
    reference_image_ref: ""          # 例: gdrive:file_id

  DOG_001:
    brand: dog
    display_name: "だいふく（仮）"
    appearance: >-
      まん丸コロコロの豆柴の子犬。淡い赤毛に白いお腹、太くて短い足、くるんと巻いた尻尾。
      黒くて丸い目、いつも少し口角が上がって笑っているような顔。首に細い生成りのバンダナ。
    personality: "元気いっぱいで人懐っこい。全力で走って全力でコケる。"
    voice: "高い子犬の鳴き声。喋らない。"
    world: "明るい庭・公園・ナチュラルな室内。芝生、木のボウル、木漏れ日。"
    forbidden:
      - "実在ブランドのロゴ"
      - "人間の顔をはっきり映す"
      - "痛がる・怯える・危険に見える描写"
    reference_image_ref: ""

  ADULT_001:
    brand: adult
    display_name: "（未確定）"
