# Character Registry（§6 末尾）
# 固定キャラは reference image / 外見記述 / 性格 / 禁止事項 / 声 / 世界観 を保存。
# reference_image はリポジトリに置かず、Drive/Storage の ID かパスを指す。
#
# ★ appearance は「毎回同じ猫」に見せるための核。プロンプトにそのまま差し込まれる。
#   運用で reference_image を用意したら、それに寄せて微修正する。

characters:
  CAT_001:
    brand: cat
    display_name: "もち（仮）"
    appearance: >-
      生後間もない印象の、ふわふわの長毛の子猫。クリーム色〜薄いグレーの被毛で、耳と足先だけ
      少し濃い。顔に対して不釣り合いなほど大きく丸い琥珀色の目、小さくて短い鼻、
      ぷにっとしたピンクの肉球。頭が体に対して大きい赤ちゃん体型で、ずんぐりまんまる、
      足取りはまだおぼつかずヨチヨチ・プルプルしている。首に細い水色のリボン。
    personality: >-
      好奇心旺盛で、ちょっとドジ。まだ体の使い方に慣れておらず、踏ん張りきれずコロンと転がる、
      よろけて壁にぶつかるなど、赤ちゃん特有の不器用さがある。表情がころころ変わり、遊んでいる
      途中でも急に糸が切れたようにすとんと眠くなる。
    voice: "高くて小さな、まだ頼りない鳴き声。喋らない。"
    world: >-
      明るいナチュラルな室内。木漏れ日、観葉植物、ニットのブランケット、木の家具。
      生活感はあるが散らかっていない。
    forbidden:
      - "実在ブランドのロゴ"
      - "人間の顔をはっきり映す"
      - "痛がる・怯える・危険に見える描写"
    reference_image_ref: ""          # 例: gdrive:file_id

  DOG_001:
    brand: dog
    display_name: "だいふく（仮）"
    appearance: >-
      生まれて間もない印象の、まん丸コロコロの豆柴の子犬。淡い赤毛に白いお腹、体に対して
      まだ大きすぎる太くて短い足、くるんと巻いた尻尾。黒くて丸い、幼さの残る目、いつも少し
      口角が上がって笑っているような顔。お腹がぽっこり丸く、赤ちゃん特有のプニプニした体型。
      首に細い生成りのバンダナ。
    personality: >-
      元気いっぱいで人懐っこい。まだ自分の足の大きさに体がついていっておらず、全力で走って
      足がもつれて盛大にコケる、しっぽを追いかけて目を回す等、幼い犬らしい可愛い不器用さがある。
    voice: "高くてまだ舌足らずな子犬の鳴き声。喋らない。"
    world: "明るい庭・公園・ナチュラルな室内。芝生、木のボウル、木漏れ日。"
    forbidden:
      - "実在ブランドのロゴ"
      - "人間の顔をはっきり映す"
      - "痛がる・怯える・危険に見える描写"
    reference_image_ref: ""

  ADULT_001:
    brand: adult
    display_name: "（未確定）"
    appearance: "成人であることが明確な外見。未成年に見える要素を禁止。"
    personality: "（性格）"
    voice: "（声の方向性）"
    world: "ファッション / 日常 / POV 等、媒体規約内"
    forbidden:
      - "未成年・若年に見える表現"
      - "露骨な性的表現・裸体・性行為"
    reference_image_ref: ""
