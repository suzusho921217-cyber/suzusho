# 媒体設定（§9 実装前提 / §20 公式API）
# policy_url は policy_sync.yml が版差分を監視する対象（§5）。
# 実際の scope / 指標名は実装時に公式ドキュメントで再確認する。

platforms:
  youtube:
    enabled: true
    api: "YouTube Data API v3 (videos.insert) + YouTube Analytics API"
    policy_urls:
      - https://developers.google.com/youtube/v3/docs/videos
      - https://developers.google.com/youtube/analytics/metrics
    metrics_available: [views, engagedViews, averageViewDuration, shares, subscribersGained, estimatedRevenue]
    notes: "未監査APIプロジェクトのアップロードは private 制限があり得る。監査前提。"
    secret_env:
      - YOUTUBE_OAUTH_CLIENT_ID       # OAuthクライアントは共通(全ブランドで同じもの)
      - YOUTUBE_OAUTH_CLIENT_SECRET
      # リフレッシュトークンはチャンネル(ブランド)ごとに別発行。
      # YOUTUBE_OAUTH_REFRESH_TOKEN_<BRAND大文字>（例: _CAT / _DOG）。
      # 未設定時は YOUTUBE_OAUTH_REFRESH_TOKEN にフォールバック(単一アカウント運用向け)。
      - YOUTUBE_OAUTH_REFRESH_TOKEN_CAT
      - YOUTUBE_OAUTH_REFRESH_TOKEN_DOG

  tiktok:
    enabled: false
    api: "Content Posting API (Direct Post) + Display API"
    policy_urls:
      - https://developers.tiktok.com/docs/en/content-posting-api-get-started
      - https://developers.tiktok.com/docs/en/display-api-overview
    metrics_available: [views, likes, comments, shares]
    notes: "video.publish 承認が必要。未監査クライアント投稿は private。Direct Post は明示的同意等の UX 要件あり。"
    secret_env:
      - TIKTOK_CLIENT_KEY
      - TIKTOK_CLIENT_SECRET
      - TIKTOK_ACCESS_TOKEN
      - TIKTOK_REFRESH_TOKEN

  instagram:
    enabled: false                   # Cat Moments の Instagram 未整備のため保留(Dog は実装・実キー確認済み)
    api: "Instagram Graph API (Instagram Login方式) /media + /media_publish + /insights"
    policy_urls:
      - https://developers.facebook.com/docs/instagram-platform
    metrics_available: [likes, comments, shares, saved, reach, views]
    notes: >-
      動画は一般公開HTTPS URLからの取得方式(video_url)のため、GCSの非公開バケット+
      署名付きURLで一時公開してから投稿する(publishers/instagram.py)。
      2026-09-05 実キーで投稿・指標取得とも確認済み(Dog Momentsチャンネル)。
    secret_env:
      - META_APP_ID              # OAuthアプリは共通(全ブランドで同じもの)
      - META_APP_SECRET
      # トークン・ビジネスアカウントIDはチャンネル(ブランド)ごとに別発行。
      # IG_ACCESS_TOKEN_<BRAND大文字> / IG_BUSINESS_ACCOUNT_ID_<BRAND大文字>（例: _CAT / _DOG）。
      # 未設定時は IG_ACCESS_TOKEN / IG_BUSINESS_ACCOUNT_ID にフォールバック。
      - IG_ACCESS_TOKEN_CAT
      - IG_ACCESS_TOKEN_DOG
      - IG_BUSINESS_ACCOUNT_ID_CAT
      - IG_BUSINESS_ACCOUNT_ID_DOG
      - GCS_BUCKET_NAME           # 動画一時公開用（sheetsと同じサービスアカウントを使用）
      - GOOGLE_CLOUD_PROJECT

  x:
    enabled: false
    api: "X API v2 + Media Upload"
    policy_urls:
      - https://docs.x.com/x-api/media/quickstart/best-practices
      - https://docs.x.com/x-api/fundamentals/metrics
      - https://docs.x.com/x-api/posts/create-post
    metrics_available: [impressions, video_views, playback_25, playback_50, playback_75, playback_100]
    notes: "pay-per-use。費用上限を必ず設定（§13）。"
    secret_env:
      - X_API_KEY
      - X_API_SECRET
      - X_ACCESS_TOKEN
      - X_ACCESS_TOKEN_SECRET
