# コスト・投資管理（§13）
# 実際の動画API単価は契約時に再計算する。

currency: JPY
validation_window_days: 90

# ★Gemini API はプリペイド（前払い）・オートチャージ OFF。残高が尽きると Google 側で止まる（402）。
#   2026-09: ¥5,000 購入 → 9/30 に使い切り。2026-10-02 に「犬猫2本/日で12月末まで3か月継続」と決定。
#   月 ≒ ¥88 × 2本 × 31日 ≒ ¥5,500。前払いは月 ¥5,000〜6,000 買い足す（買った額に monthly_budget を合わせる）。
#   total は運用開始からの累計（9月 ¥5,000 ＋ 10〜12月 ¥6,000×3 = ¥23,000）。
total_investment_cap: 23000
monthly_budget: 5000                # 2026-10 は前払い ¥5,000 購入。Google 側より先に95%(¥4,750)で止める
daily_budget: 200                   # 1日2本ぶん（実単価 ¥88 × 2 = ¥176 < 95%=¥190）

retry_budget_ratio: 0.20           # 再生成による追加費の上限（月次予算に対する比率）

brand_budget:                      # 1ブランドの上限（月。1日1本 × 31日 ≒ ¥2,730）
  cat: 3500
  dog: 3500
  adult: 1500

automatic_stop_ratio: 0.95         # 上限95%で新規生成停止、既存投稿/分析のみ継続

# 参考: Veo 3.1 Lite 720p の実単価は約 ¥11/s（税込）＝ 8秒で約 ¥88/本。
#   2026-09 実績: ¥5,000 の前払いで約57本（見積り ¥8/s・¥64/本は約4割安すぎた）。
